name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          APP_URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            # Default placeholder - replace with your actual Streamlit Cloud URL
            APP_URL="https://hcl-ml-final-project.streamlit.app"
          fi
          echo "Pinging $APP_URL to prevent sleep..."
          curl -sL --max-time 30 "$APP_URL" > /dev/null || true
          echo "App ping completed successfully."
